# Konfigurasi Nginx - reverse proxy ke app Node.js (oven-dryer-monitor) di localhost:3000
# Cara pasang: lihat README bagian "Deploy ke VPS Jagoan Hosting"
#
# GANTI "ganti-domain-anda.com" di bawah dengan domain/subdomain Anda sendiri
# sebelum menjalankan: sudo certbot --nginx -d ganti-domain-anda.com

server {
    listen 80;
    listen [::]:80;
    server_name ganti-domain-anda.com;

    # Socket.IO / WebSocket butuh header Upgrade & Connection ini
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}

# Setelah certbot --nginx dijalankan, certbot otomatis menambahkan
# server block "listen 443 ssl;" beserta sertifikat Let's Encrypt di sini,
# dan mengubah block di atas jadi redirect http -> https. Tidak perlu diedit manual.
